<div (click)="onTileClick()" (transitionend)="onTransitionEnd()"
     (keydown.enter)="onTileClick()" (keydown.space)="$event.preventDefault(); onTileClick()"
     [attr.aria-label]="tile_label()" class="position-relative w-100 h-100 component-pix-grid-element"
     role="button" tabindex="0">
  <svg class="w-100 h-auto square-placeholder" viewBox="0 0 1 1"></svg>
  <div #user_interactive
       [class.highlight-btn--grid-element]="grid_element_type() === 0"
       [class.flip-element]="grid_element_type() === 0"
       [class.highlight-btn]="grid_element_type() === 1"
       class="w-100 h-100 rounded-3 grid-element-inner emoji-wrapper" data-grid-element-status="3">
    @if (grid_element_type() === 0) {
      <div class="back-face">
        <p class="m-0 p-0 emoji">
          <i class="twa {{ twa_emoji_class_back_face() }}"></i>
        </p>
      </div>
    }
    <div class="front-face">
      <p class="m-0 p-0 emoji">
        <i class="twa {{ twa_emoji_class_front_face() }}"></i>
      </p>
    </div>
  </div>
</div>
